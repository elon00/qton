<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="QTON — reality-first Quantum-Secured TON infrastructure">
<title>QTON — Quantum-Secured TON Infrastructure</title>
<script src="https://unpkg.com/@tonconnect/ui@3.0.0/dist/tonconnect-ui.min.js"></script>
<style>
:root{--bg:#070a10;--panel:#0d121b;--panel2:#111827;--line:#1e293b;--text:#e5edf7;--muted:#8190a5;--cyan:#67e8f9;--green:#6ee7b7;--amber:#fbbf24;--red:#fb7185;--violet:#c4b5fd;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#0b1d2a 0,transparent 32%),var(--bg);color:var(--text)}button,input{font:inherit}button{cursor:pointer}.shell{min-height:100vh}.top{position:sticky;top:0;z-index:5;height:68px;border-bottom:1px solid #172033;background:rgba(7,10,16,.9);backdrop-filter:blur(16px);display:flex;align-items:center;justify-content:space-between;padding:0 22px}.brand{display:flex;align-items:center;gap:12px}.logo{width:38px;height:38px;border:1px solid #155e75;border-radius:11px;display:grid;place-items:center;color:var(--cyan);font-weight:800;background:#08212b}.brand b{letter-spacing:.18em}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.12em}.status{display:flex;align-items:center;gap:8px}.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 12px var(--green)}.connect{border:1px solid #155e75;background:#08212b;color:var(--cyan);border-radius:9px;padding:9px 13px;font-weight:700}.layout{display:grid;grid-template-columns:220px 1fr}.side{border-right:1px solid #172033;min-height:calc(100vh - 68px);padding:16px 12px}.nav{width:100%;text-align:left;background:none;border:1px solid transparent;color:var(--muted);padding:11px 12px;border-radius:9px;margin-bottom:5px}.nav.active,.nav:hover{color:var(--text);background:#0d1723;border-color:#1d3448}.main{padding:28px;max-width:1400px;width:100%;margin:auto}.hero{border:1px solid var(--line);background:linear-gradient(120deg,#0d1723,#090e16);border-radius:18px;padding:26px;margin-bottom:18px}.eyebrow{color:var(--cyan);font-size:11px;letter-spacing:.16em;text-transform:uppercase}.hero h1{margin:9px 0;font-size:30px}.hero p{color:var(--muted);max-width:850px;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:rgba(13,18,27,.9);border:1px solid var(--line);border-radius:14px;padding:17px}.label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.1em}.value{font-size:25px;font-weight:800;margin:9px 0}.muted{color:var(--muted)}.badge{display:inline-flex;padding:4px 7px;border-radius:6px;font-size:10px;font-family:ui-monospace,monospace;border:1px solid #334155}.real{color:var(--green);border-color:#166534;background:#052e16}.unverified{color:var(--amber);border-color:#854d0e;background:#451a03}.blocked{color:var(--red);border-color:#881337;background:#4c0519}.experimental{color:var(--violet);border-color:#5b21b6;background:#2e1065}.section{margin-top:18px}.section h2{font-size:14px;letter-spacing:.08em;text-transform:uppercase}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:11px 8px;border-bottom:1px solid #172033;font-size:12px}.table th{color:var(--muted)}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.actions{display:flex;gap:8px;flex-wrap:wrap}.action{border:1px solid var(--line);background:#111827;color:var(--text);border-radius:8px;padding:9px 12px}.action.primary{border-color:#155e75;background:#08212b;color:var(--cyan)}.action.danger{border-color:#7f1d1d;color:#fda4af}.form{display:grid;gap:10px;max-width:560px}.form input{background:#080d14;border:1px solid var(--line);color:var(--text);padding:11px;border-radius:8px}.notice{padding:12px;border:1px solid #854d0e;background:#2b1805;color:#fde68a;border-radius:10px;font-size:12px;line-height:1.5}.empty{padding:35px;text-align:center;border:1px dashed #334155;border-radius:12px;color:var(--muted)}.mobile{display:none}@media(max-width:900px){.layout{grid-template-columns:1fr}.side{display:none}.mobile{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:5;background:#080d14;border-top:1px solid var(--line);padding:7px}.mobile button{flex:1;background:none;border:0;color:var(--muted);padding:8px;font-size:10px}.grid{grid-template-columns:repeat(2,1fr)}.main{padding:18px 14px 82px}.top{padding:0 12px}.status .net{display:none}}@media(max-width:540px){.grid{grid-template-columns:1fr}.hero h1{font-size:24px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const MASTER='kQCI8yoRda7UzQSOOypvN_trGrzNb4tGmRR9N-S9LOG-wW58';
const LAUNCHPAD='kQAHuKwr2EhHjjq4wG_xbUA7WtSw9j9OH9rfFrcBvxczgpmh';
const API='https://testnet.toncenter.com/api/v3';
const explorer=a=>`https://testnet.tonscan.org/address/${a}`;
let state={tab:'dashboard',wallet:null,balance:null,qton:0,txs:[],block:0,master:null,error:'',loading:false,conway:{gen:0,grid:[]}};
const fmtNano=n=>{try{n=BigInt(n||0);return (n/1000000000n).toString()+'.'+(n%1000000000n).toString().padStart(9,'0').replace(/0+$/,'')}catch{return '0'}};
const short=a=>a?`${a.slice(0,8)}…${a.slice(-8)}`:'—';
async function api(path){const r=await fetch(API+path);if(!r.ok)throw Error(`TON API ${r.status}`);return r.json()}
async function refresh(){state.loading=true;render();try{const [mc,master]=await Promise.all([api('/masterchainInfo'),api('/jetton/masters?address='+encodeURIComponent(MASTER)+'&limit=1')]);state.block=Number(mc?.last?.seqno||mc?.masterchain_info?.last?.seqno||0);state.master=master?.jetton_masters?.[0]||null;if(state.wallet){const [acct,tx,jw]=await Promise.all([api('/accountStates?address='+encodeURIComponent(state.wallet)),api('/transactions?account='+encodeURIComponent(state.wallet)+'&limit=25'),api('/jetton/wallets?owner_address='+encodeURIComponent(state.wallet)+'&jetton_address='+encodeURIComponent(MASTER)+'&limit=5')]);state.balance=acct?.accounts?.[0]?.balance||0;state.txs=tx?.transactions||[];state.qton=Number(jw?.jetton_wallets?.[0]?.balance||0)/1e9}}catch(e){state.error=e.message}finally{state.loading=false;render()}}
let tc=null;
function initTonConnect(){if(!window.TON_CONNECT_UI)return;tc=new window.TON_CONNECT_UI.TonConnectUI({manifestUrl:'https://elon00.github.io/qton/tonconnect-manifest.json',restoreConnection:true});tc.onStatusChange(w=>{state.wallet=w?.account?.address||null;refresh()})}
async function connect(){if(!tc)return alert('TON Connect unavailable');await tc.openModal()}
async function disconnect(){if(tc)await tc.disconnect();state.wallet=null;state.balance=null;state.txs=[];state.qton=0;render()}
async function sendTon(){if(!state.wallet)return alert('Connect a TON Testnet wallet first');const to=document.querySelector('#recipient').value.trim();const amount=Number(document.querySelector('#amount').value);if(!to||!Number.isFinite(amount)||amount<=0)return alert('Enter a valid recipient and positive TON amount');try{await tc.sendTransaction({validUntil:Math.floor(Date.now()/1000)+300,network:'-3',messages:[{address:to,amount:String(Math.round(amount*1e9))}]});await refresh();alert('Wallet signed/submitted the transaction. Confirmation is read from TON Testnet.')}catch(e){alert('Transaction not submitted: '+e.message)}}
function seedConway(){const n=18;return Array.from({length:n},()=>Array.from({length:n},()=>Math.random()<.35?1:0))}
function conwayStep(g){const n=g.length,r=g[0].length,o=Array.from({length:n},()=>Array(r).fill(0));for(let y=0;y<n;y++)for(let x=0;x<r;x++){let c=0;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)if(dx||dy)c+=g[(y+dy+n)%n][(x+dx+r)%r];o[y][x]=g[y][x]?(c===2||c===3?1:0):(c===3?1:0)}return o}
function entropy(g){const c={};for(let y=0;y<g.length-1;y+=2)for(let x=0;x<g[0].length-1;x+=2){const k=(g[y][x]<<3)|(g[y][x+1]<<2)|(g[y+1][x]<<1)|g[y+1][x+1];c[k]=(c[k]||0)+1}let total=0;Object.values(c).forEach(v=>total+=v);let h=0;Object.values(c).forEach(v=>{const p=v/total;h-=p*Math.log2(p)});return (h/4).toFixed(3)}
function tab(t){state.tab=t;render()}
function render(){const app=document.querySelector('#app');const connected=!!state.wallet;const bal=state.balance==null?'—':fmtNano(state.balance);const q=state.qton.toLocaleString(undefined,{maximumFractionDigits:9});let body='';
if(state.tab==='dashboard')body=`<div class="hero"><div class="eyebrow">Reality-first command center</div><h1>Quantum-Secured TON Infrastructure</h1><p>Live TON Testnet telemetry, wallet-authorized transactions and evidence-gated security. No fabricated balances, receipts, prices, KAT passes or launch activity are shown.</p><div class="actions"><button class="action primary" onclick="tab('wallet')">Open Wallet</button><button class="action" onclick="tab('security')">Security Center</button></div></div><div class="grid"><div class="card"><div class="label">TON balance</div><div class="value">${bal}</div><span class="badge ${connected?'real':'blocked'}">${connected?'LIVE CHAIN':'DISCONNECTED'}</span></div><div class="card"><div class="label">QTON balance</div><div class="value">${connected?q:'—'}</div><span class="badge ${connected?'unverified':'blocked'}">${connected?'LIVE INDEX':'NO WALLET'}</span></div><div class="card"><div class="label">Masterchain seqno</div><div class="value">${state.block||'—'}</div><span class="badge real">TON TESTNET</span></div><div class="card"><div class="label">PQC status</div><div class="value">BLOCKED</div><span class="badge blocked">EVIDENCE GATE</span></div></div><div class="grid section"><div class="card"><div class="label">QTON master</div><p class="mono">${short(MASTER)}</p><a href="${explorer(MASTER)}" target="_blank" class="muted">Open explorer ↗</a></div><div class="card"><div class="label">Launchpad</div><p class="mono">${short(LAUNCHPAD)}</p><a href="${explorer(LAUNCHPAD)}" target="_blank" class="muted">Open explorer ↗</a></div><div class="card"><div class="label">Live master data</div><p>${state.master?`Supply: ${state.master.total_supply}<br>Mintable: ${String(state.master.mintable)}`:'Unavailable'}</p></div><div class="card"><div class="label">Reality policy</div><p class="muted">Unknown evidence is never promoted to verified.</p></div></div>`;
if(state.tab==='wallet')body=`<div class="hero"><div class="eyebrow">Quantum wallet</div><h1>Wallet & Real Transactions</h1><p>TON Connect is the only signing path. QTON writes remain blocked until their exact Jetton payload and contract semantics are verified.</p><div class="actions">${connected?`<button class="action" onclick="disconnect()">Disconnect</button>`:`<button class="action primary" onclick="connect()">Connect TON Testnet Wallet</button>`}</div></div><div class="grid"><div class="card"><div class="label">Address</div><div class="value mono" style="font-size:15px">${short(state.wallet)}</div></div><div class="card"><div class="label">TON</div><div class="value">${bal}</div></div><div class="card"><div class="label">QTON</div><div class="value">${connected?q:'—'}</div></div><div class="card"><div class="label">PQC proof</div><div class="value">BLOCKED</div></div></div><div class="card section"><h2>Send TON — real wallet signing</h2><div class="form"><input id="recipient" placeholder="TON Testnet recipient address"><input id="amount" type="number" min="0" step="0.000000001" placeholder="Amount in TON"><div class="actions"><button class="action primary" onclick="sendTon()" ${connected?'':'disabled'}>Open wallet & sign</button></div></div></div><div class="card section"><h2>On-chain transaction history</h2>${state.txs.length?`<table class="table"><thead><tr><th>Hash</th><th>LT</th><th>Time</th><th>Status</th></tr></thead><tbody>${state.txs.map(x=>`<tr><td class="mono">${short(x.hash)}</td><td>${x.lt||'—'}</td><td>${x.now?new Date(x.now*1000).toLocaleString():'—'}</td><td><span class="badge ${x.description?.aborted?'blocked':'real'}">${x.description?.aborted?'FAILED':'CHAIN DATA'}</span></td></tr>`).join('')}</tbody></table>`:'<div class="empty">Connect a wallet to read live Testnet transactions.</div>'}</div>`;
if(state.tab==='launchpad')body=`<div class="hero"><div class="eyebrow">Launchpad</div><h1>Live-contract gate</h1><p>No fabricated projects or bonding-curve metrics are displayed. The configured launchpad address is shown only as a deployment reference.</p><a class="action" href="${explorer(LAUNCHPAD)}" target="_blank">Inspect launchpad on TON Testnet ↗</a></div><div class="card"><span class="badge unverified">REAL_UNVERIFIED</span><h2>Participation blocked</h2><p class="muted">A production launchpad requires independently verified deployed code, message layouts, token accounting and end-to-end receipt reconciliation. Until those proofs exist, the UI does not invent launches or accept funds.</p></div>`;
if(state.tab==='conway')body=`<div class="hero"><div class="eyebrow">Deterministic algorithm</div><h1>Conway Intelligence</h1><p>This is a deterministic cellular-automaton computation. It is not presented as physical quantum randomness or a blockchain oracle.</p><div class="actions"><button class="action primary" onclick="state.conway.grid=seedConway();state.conway.gen=0;render()">New local state</button><button class="action" onclick="state.conway.grid=conwayStep(state.conway.grid);state.conway.gen++;render()">Step</button></div></div><div class="card"><div class="label">Generation</div><div class="value">${state.conway.gen}</div><span class="badge experimental">EXPERIMENTAL</span><p class="mono muted">Shannon H: ${state.conway.grid.length?entropy(state.conway.grid):'—'}</p><div style="display:grid;grid-template-columns:repeat(18,1fr);gap:2px;max-width:650px">${state.conway.grid.flatMap(r=>r.map(c=>`<span style="aspect-ratio:1;background:${c?'#67e8f9':'#111827'};border-radius:2px"></span>`)).join('')}</div></div>`;
if(state.tab==='agent')body=`<div class="hero"><div class="eyebrow">Agent console</div><h1>Autonomous execution is evidence-gated</h1><p>No fake fallback model is used. A trusted server-side AI endpoint must be configured before agent actions are enabled; browser builds never contain provider API keys.</p><span class="badge blocked">BLOCKED</span></div>`;
if(state.tab==='security')body=`<div class="hero"><div class="eyebrow">Security & reality</div><h1>Evidence Center</h1><p>Current runtime claims only what can be verified from live chain data. PQC verification is blocked rather than simulated.</p></div><div class="grid"><div class="card"><div class="label">TON chain state</div><div class="value">${state.block?'LIVE':'BLOCKED'}</div><span class="badge ${state.block?'real':'blocked'}">${state.block?'REAL_VERIFIED':'BLOCKED'}</span></div><div class="card"><div class="label">QTON master</div><div class="value">${state.master?'FOUND':'UNKNOWN'}</div><span class="badge ${state.master?'real':'blocked'}">${state.master?'LIVE INDEX':'DATA_UNAVAILABLE'}</span></div><div class="card"><div class="label">ML-DSA-65</div><div class="value">BLOCKED</div><span class="badge blocked">NO SYNTHETIC PROOF</span></div><div class="card"><div class="label">Independent audit</div><div class="value">REQUIRED</div><span class="badge unverified">EXTERNAL</span></div></div><div class="card section"><h2>Production gates</h2><table class="table"><tr><td>Live TON reads</td><td><span class="badge real">REAL</span></td></tr><tr><td>Wallet signing</td><td><span class="badge real">TON CONNECT</span></td></tr><tr><td>QTON transfer</td><td><span class="badge blocked">BLOCKED</span></td></tr><tr><td>Launchpad writes</td><td><span class="badge blocked">BLOCKED</span></td></tr><tr><td>PQC on-chain enforcement</td><td><span class="badge unverified">UNVERIFIED</span></td></tr><tr><td>External security audit</td><td><span class="badge unverified">REQUIRED</span></td></tr></table></div>`;
app.innerHTML=`<div class="shell"><header class="top"><div class="brand"><div class="logo">Q</div><div><b>QTON</b><small>QUANTUM-SECURED TON INFRASTRUCTURE</small></div></div><div class="status"><span class="dot"></span><span class="net mono">TON TESTNET · #${state.block||'—'}</span><button class="connect" onclick="${connected?'disconnect()':'connect()'}">${connected?short(state.wallet):'Connect Wallet'}</button></div></header><div class="layout"><aside class="side">${[['dashboard','Command Center'],['wallet','Quantum Wallet'],['launchpad','Launchpad'],['conway','Conway Intelligence'],['agent','AI Agent'],['security','Security & Reality']].map(([id,l])=>`<button class="nav ${state.tab===id?'active':''}" onclick="tab('${id}')">${l}</button>`).join('')}</aside><main class="main">${state.error?`<div class="notice">Live data error: ${state.error}. No cached/fabricated value is being shown.</div>`:''}${body}</main></div><nav class="mobile">${[['dashboard','Home'],['wallet','Wallet'],['launchpad','Launch'],['conway','Conway'],['agent','Agent'],['security','Security']].map(([id,l])=>`<button onclick="tab('${id}')">${l}</button>`).join('')}</nav></div>`}
state.conway.grid=seedConway();initTonConnect();refresh();
</script>
</body>
</html>

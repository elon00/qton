name: QTON Testnet Reality & TVM Verification Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify-qton:
    name: QTON Reality Gate Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Pillar 1-6 Compilation (FunC to TVM BOC)
        run: npm run build

      - name: Pillar 1-6 TVM Sandbox Verification
        run: npm test

      - name: Execute Testnet Reality Gate (Live RPC Audit)
        env:
          TESTNET_WALLET_MNEMONIC: ${{ secrets.TESTNET_WALLET_MNEMONIC }}
        run: |
          if [ -z "$TESTNET_WALLET_MNEMONIC" ]; then
            echo "::notice::Live testnet gate skipped because TESTNET_WALLET_MNEMONIC is not configured."
            exit 0
          fi
          npm run testnet:gate

      - name: Remove legacy local wallet material
        if: always()
        run: rm -f testnet-wallet.json

      - name: Upload Testnet Evidence Artifact
        uses: actions/upload-artifact@v7
        with:
          name: testnet-evidence
          path: |
            testnet-evidence.json
            deployment-testnet.json
            build/

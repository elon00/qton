name: Explicit TON Testnet Transfer

on:
  workflow_dispatch:
    inputs:
      recipient:
        description: 'TON Testnet recipient address'
        required: true
        type: string
      amount_ton:
        description: 'Testnet TON amount (maximum 1.0)'
        required: true
        default: '0.1'
        type: string
      confirm:
        description: 'Type TESTNET_TRANSFER to authorize this testnet transaction'
        required: true
        type: string

permissions:
  contents: read

jobs:
  transfer:
    if: inputs.confirm == 'TESTNET_TRANSFER'
    name: Explicit TON Testnet Transfer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Broadcast explicitly authorized testnet transfer
        env:
          TESTNET_WALLET_MNEMONIC: ${{ secrets.TESTNET_WALLET_MNEMONIC }}
          QTON_ENABLE_TESTNET_TRANSFER: 'true'
          QTON_TESTNET_RECIPIENT: ${{ inputs.recipient }}
          QTON_TESTNET_AMOUNT: ${{ inputs.amount_ton }}
        run: |
          test -n "$TESTNET_WALLET_MNEMONIC" || { echo "TESTNET_WALLET_MNEMONIC secret is required"; exit 1; }
          npm run drip:ton

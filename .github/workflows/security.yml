name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build contracts
        run: npm run build
      - name: Unit and adversarial tests
        run: npm test
      - name: Repository security audit
        run: npm run audit:security
      - name: Cryptographic audit
        run: npm run audit:crypto
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
